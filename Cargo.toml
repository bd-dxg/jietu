[package]
name = "jietu"
version = "0.2.0"
edition = "2024"
description = "轻量原生截图与标注工具（Windows，纯 CPU 渲染）"
license = "GPL-3.0-only"

[profile.release]
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true

[dependencies]
jpeg-encoder = "0.7.1"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
tiny-skia = "0.12.0"
toml = "1.1.6"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_Security", "Win32_Graphics_Gdi", "Win32_Graphics_DirectWrite", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Controls_Dialogs", "Win32_System_SystemInformation", "Win32_System_Ole"] }
# implement 宏展开需要 windows_core crate 在 crate root 可见（COM 自定义接口）
windows-core = { version = "0.62.2", default-features = false, features = ["std"] }

[build-dependencies]
embed-resource = "3.0.11"
